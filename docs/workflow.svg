<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
<title id="title">agent-trace-lite workflow</title><desc id="desc">JSONL enters the offline normalizer, sensitive fields are redacted, and a deterministic HTML timeline is written.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#18304a"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#72e0bd"/></marker></defs>
<rect width="1000" height="230" rx="18" fill="url(#bg)"/><text x="44" y="43" fill="#eef3ff" font-family="system-ui,sans-serif" font-size="25" font-weight="700">agent-trace-lite</text><text x="44" y="69" fill="#9eacc7" font-family="system-ui,sans-serif" font-size="14">offline traces · deterministic output · safe display</text>
<g font-family="system-ui,sans-serif"><rect x="42" y="105" width="190" height="78" rx="12" fill="#172b42" stroke="#436080"/><text x="62" y="136" fill="#72e0bd" font-size="13" font-weight="700">01 · INPUT</text><text x="62" y="161" fill="#eef3ff" font-size="16">JSONL events</text><path d="M244 144h72" stroke="#72e0bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="326" y="105" width="230" height="78" rx="12" fill="#172b42" stroke="#436080"/><text x="346" y="136" fill="#72e0bd" font-size="13" font-weight="700">02 · NORMALIZE</text><text x="346" y="161" fill="#eef3ff" font-size="16">sort + redact</text><path d="M568 144h72" stroke="#72e0bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="105" width="308" height="78" rx="12" fill="#172b42" stroke="#436080"/><text x="670" y="136" fill="#72e0bd" font-size="13" font-weight="700">03 · INSPECT</text><text x="670" y="161" fill="#eef3ff" font-size="16">static HTML timeline</text></g></svg>
