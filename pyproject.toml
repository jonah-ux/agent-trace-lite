[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trace-lite"
version = "0.1.0"
description = "Offline, provider-neutral JSONL trace normalizer and static HTML viewer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jonah UX"}]
keywords = ["agents", "tracing", "jsonl", "observability", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
sandbox = ["psutil>=5.9"]

[project.scripts]
agent-trace = "agent_trace_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
