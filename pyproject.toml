[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_trace_lite"
version = "0.1.0"
description = "offline agent trace viewer"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jonah Helland"}]
dependencies = []

[project.scripts]
agent-trace = "agent_trace_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
